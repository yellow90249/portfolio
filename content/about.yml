title: About Me
description: Learn more about my journey as a backend engineer, my approach to building distributed systems, and my passion for clean, reliable infrastructure.
content: |
  Hi, I'm **Gary Chung**, a backend engineer with over six years of experience building systems that scale. I care deeply about reliability, observability, and writing code that my teammates can understand and maintain long after I've moved on.

  My path started in computer science, where I fell in love with the elegance of algorithms and the unforgiving feedback loop of production systems. Since then I've worked across the stack — but I keep coming back to the backend, where the hard constraints live.

  ### How I Work

  I believe good backend engineering starts with **clear thinking about data and failure modes**, not frameworks. Before writing code, I invest time in system design: understanding access patterns, sketching consistency boundaries, and identifying the failure scenarios that will matter at 3am.

  I'm most productive in **Go** for services and **PostgreSQL** for storage, but I adapt to whatever the team is using. I've deployed on Kubernetes, wired up Prometheus/Grafana stacks, and debugged distributed tracing across microservices at scale.

  ### What I Value

  **Operational simplicity** — a system that's easy to reason about under pressure is more valuable than one that's elegant on paper. I bias toward boring technology and invest in runbooks, dashboards, and alerts so on-call is survivable.

  **Incremental delivery** — I prefer shipping behind feature flags and dark-launching over big-bang releases. This applies to database migrations, API changes, and infrastructure upgrades alike.

  ### Beyond Work

  When I'm not in a terminal, I contribute to open-source projects, participate in CTF competitions, and go hiking to decompress. I also write occasionally about distributed systems and engineering culture.

  Thanks for stopping by. Browse my [projects](/projects) or [get in touch](/#contact) if you'd like to work together!
