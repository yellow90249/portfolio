faq:
  title: Frequently Asked Questions
  description: Answers to common questions about my process and services.
  categories:
    - title: Services & Process
      questions:
        - label: What services do you offer?
          content: |
            I specialize in backend engineering and cloud infrastructure. This includes designing and building REST/gRPC APIs, distributed systems architecture, database schema design and optimization, Kubernetes cluster setup and operations, CI/CD pipeline automation, and technical consulting for teams scaling their backend.
        - label: What is your engineering process like?
          content: |
            I start with requirements gathering and system design, producing an architecture document before writing a single line of code. From there I iterate with small, well-tested increments — integration tests, load tests, and observability baked in from day one. I work closely with product and frontend teams to keep interfaces clean and versioned.
        - label: Do you work with startups?
          content: |
            Absolutely. Early-stage startups benefit from pragmatic architecture choices that can scale without a full rewrite. I help teams move fast without accumulating crippling technical debt.
    - title: Pricing & Timelines
      questions:
        - label: How much does a project typically cost?
          content: |
            It depends on scope. API design and implementation projects start around $5,000. Full system architecture engagements — including infrastructure, CI/CD, and observability — typically range from $10,000 to $30,000. For ongoing consulting, my day rate is $800.
        - label: What are your payment terms?
          content: |
            I require a 40% deposit to kick off the project, with the remaining 60% due on delivery. I accept bank transfer and Stripe.
        - label: How long does a typical project take?
          content: |
            A focused API project takes 2–4 weeks. A full microservices migration or greenfield backend build typically runs 2–4 months depending on complexity and team size.
        - label: Do you offer retainers or ongoing support?
          content: |
            Yes. Many clients keep me on a part-time retainer for ongoing architecture reviews, incident support, and feature development. Let me know if that's something you need.
    - title: About Me
      questions:
        - label: What do you enjoy most about your work?
          content: |
            I love designing systems that are both correct and operationally boring — the kind that run for months without surprises. Getting a distributed system to behave predictably under failure conditions is genuinely satisfying.
        - label: What are your hobbies outside of work?
          content: |
            When I'm not writing Go or reviewing Kubernetes manifests, I enjoy contributing to open-source projects, participating in CTF competitions, and exploring local hiking trails.
