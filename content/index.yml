faq:
  title: 常見問題
  description: 關於我的工作流程與服務的常見問題解答。
  categories:
    - title: 服務與流程
      questions:
        - label: 你提供哪些服務？
          content: |
            我專精於後端工程與雲端基礎設施。包含設計與建置 REST/gRPC API、分散式系統架構、資料庫 schema 設計與優化、Kubernetes 叢集建置與維運、CI/CD 流程自動化，以及為擴展後端的團隊提供技術顧問服務。
        - label: 你的工程流程是什麼樣的？
          content: |
            我從需求收集與系統設計開始，在寫下第一行程式碼之前先產出架構文件。接著以小而經過充分測試的增量進行迭代——整合測試、壓力測試，以及從第一天起就內建的可觀測性。我與產品和前端團隊密切合作，確保介面乾淨且有版本管理。
        - label: 你接新創公司的案子嗎？
          content: |
            當然。早期新創公司能從務實的架構選擇中受益，這些選擇可以擴展而不需要完全重寫。我幫助團隊快速推進，同時不累積沉重的技術債。
    - title: 定價與時程
      questions:
        - label: 一個專案通常要多少錢？
          content: |
            視範圍而定。API 設計與實作專案起價約 5,000 美元。完整的系統架構合約——包含基礎設施、CI/CD 與可觀測性——通常在 10,000 到 30,000 美元之間。持續顧問服務的日費為 800 美元。
        - label: 付款條件是什麼？
          content: |
            我需要 40% 的訂金才能啟動專案，其餘 60% 於交付時付清。接受銀行轉帳和 Stripe。
        - label: 一個典型的專案需要多久？
          content: |
            專注的 API 專案需要 2–4 週。完整的微服務遷移或全新的後端建置通常需要 2–4 個月，視複雜度和團隊規模而定。
        - label: 你提供顧問保留金或持續支援嗎？
          content: |
            是的。許多客戶以兼職保留金的方式與我合作，用於持續的架構審查、事故支援和功能開發。如果您有這方面的需求，請告訴我。
    - title: 關於我
      questions:
        - label: 你最享受工作的哪個部分？
          content: |
            我喜歡設計既正確又在運維上「無聊」的系統——那種能連續運行數月而不出意外的系統。讓分散式系統在故障條件下也能可預測地運作，是真正令人滿足的事。
        - label: 工作之外你有什麼愛好？
          content: |
            在不寫 Go 或審查 Kubernetes manifests 的時候，我喜歡貢獻開源專案、參加 CTF 競賽，以及探索在地的登山步道。
