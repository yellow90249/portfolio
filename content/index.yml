faq:
  title: 常見問題
  description: 關於我的工作流程與服務的常見問題解答。
  categories:
    - title: 服務與流程
      questions:
        - label: 你提供哪些服務？
          content: |
            我專精於後端工程與雲端基礎設施。包含設計與建置 REST/gRPC API、分散式系統架構、資料庫 schema 設計與優化、Kubernetes 叢集建置與維運、CI/CD 流程自動化，以及為擴展後端的團隊提供技術顧問服務。
        - label: 你的工程流程是什麼樣的？
          content: |
            我從需求收集與系統設計開始，在寫下第一行程式碼之前先產出架構文件。接著以小而經過充分測試的增量進行迭代——整合測試、壓力測試，以及從第一天起就內建的可觀測性。我與產品和前端團隊密切合作，確保介面乾淨且有版本管理。
        - label: 你接新創公司的案子嗎？
          content: |
            當然。早期新創公司能從務實的架構選擇中受益，這些選擇可以擴展而不需要完全重寫。我幫助團隊快速推進，同時不累積沉重的技術債。
    - title: 定價與時程
      questions:
        - label: 一個專案通常要多少錢？
          content: |
            視範圍而定。單一功能或 API 模組起價約 NT$3 萬～10 萬；完整後端系統（含資料庫設計、部署、CI/CD）通常在 NT$15 萬～50 萬之間。持續顧問或技術審查則以 NT$15,000～30,000 / 天計費。
        - label: 付款條件是什麼？
          content: |
            通常需要 30%～50% 訂金才能啟動專案，其餘於交付時付清。接受銀行轉帳或其他雙方同意的方式。
        - label: 一個典型的專案需要多久？
          content: |
            單一 API 或功能模組約 1–3 週。完整後端系統建置通常需要 1–3 個月，視需求複雜度與溝通頻率而定。
        - label: 你提供顧問保留金或持續支援嗎？
          content: |
            可以。如果需要長期技術諮詢、系統維護或功能迭代，歡迎討論月費合作方式。
    - title: 關於我
      questions:
        - label: 你最享受工作的哪個部分？
          content: |
            看到實做的系統能穩定面對大流量，這件事本身就很有成就感。
        - label: 工作之外你有什麼愛好？
          content: |
            打電動、看技術文章、偶爾研究一些有趣的開源工具，最近在玩 AI 相關的東西。
