title: gshop-api — Node.js REST API 部署於 GKE
description: 使用 Node.js/Express 建構 REST API，提供商品、訂單、會員等功能，部署於 GKE Autopilot，並透過 GitHub Actions 實現自動化 CI/CD。過程中解決了 Supabase IPv6 連線問題、GCP Load Balancer 健康檢查失敗導致的 502，以及 GKE 映像拉取權限問題。
image: https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=1470&q=80
url: "#"
tags: ["Node.js", "GKE", "Kubernetes", "CI/CD", "PostgreSQL"]
date: "2025"
challenges:
  - problem: "Supabase 連線失敗（ENOTFOUND）"
    cause: "Supabase 直連位址 db.xxx.supabase.co:5432 僅支援 IPv6，而 GKE Autopilot 只有 IPv4"
    solution: "改用 Supabase Session Pooler（aws-1-ap-southeast-1.pooler.supabase.com:5432），透過 IPv4 連線"
  - problem: "502 Bad Gateway — 健康檢查失敗"
    cause: "GCP Load Balancer 預設對 GET / 做健康檢查，但 API 沒有 / 路由，回傳非 200"
    solution: "建立 BackendConfig 將健康檢查路徑指定為 /health，並在 Service 加上對應 annotation"
  - problem: "ImagePullBackOff — GKE 無法拉取映像"
    cause: "GKE Service Account 沒有 Artifact Registry 的讀取權限"
    solution: "透過 gcloud projects add-iam-policy-binding 授予 roles/artifactregistry.reader 權限"
