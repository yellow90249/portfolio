title: gshop-dashboard — Nuxt.js SSR 管理後台部署於 GKE
description: 使用 Nuxt.js SSR 建構電商管理後台，負責商品、訂單、會員管理，部署於 GKE Autopilot。透過 GitHub Actions 實現推送至 main 分支自動建置與部署，並解決 SSR 應用在 GCP Load Balancer 背後的健康檢查與 Ingress 路由問題。
image: https://images.unsplash.com/photo-1551650975-87deedd944c3?auto=format&fit=crop&w=1470&q=80
url: "#"
tags: ["Nuxt.js", "SSR", "GKE", "Kubernetes", "CI/CD"]
date: "2025"
challenges:
  - problem: "502 Bad Gateway — 健康檢查失敗"
    cause: "GET / 回傳 302 redirect 到 /login，GCP Load Balancer 不將 302 視為健康狀態"
    solution: "建立 BackendConfig 將健康檢查路徑改為 /login，直接回傳 200"
  - problem: "Ingress 長時間無法取得 IP（NEG not ready）"
    cause: "Service 上殘留舊的 networking.gke.io/target-pool annotation，造成設定衝突"
    solution: "使用 kubectl annotate 移除舊 annotation，刪除後重建 Ingress"
